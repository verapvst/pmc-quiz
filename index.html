<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMC Live Quiz</title>
<style>
/* Layout: phones get one scrolling page with every question, then a results page.
   The presenter page (?host=PIN) is a full screen stage, QR view or curve view, with a control bar at the bottom. */
:root{
  --bg:#FFFFFF;
  --panel:#FFFFFF;
  --ink:#3A3A3A;
  --muted:#7F7F7F;
  --line:#E6E0DA;
  --orange:#FF6600;
  --orange-d:#E55A00;
  --tint:#FDEEE4;
  --navy:#1F2A5C;
  --display:Verdana,Geneva,"DejaVu Sans",sans-serif;
  --body:Verdana,Geneva,"DejaVu Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.brand{display:flex;align-items:center;gap:12px;font:700 .9rem var(--display);color:var(--muted)}
.logo{height:52px;width:auto;display:block}
body.host .logo{height:64px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--orange);display:inline-block}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--orange);border-radius:3px;transition:width .35s ease}
.qno{margin:0;font:600 .8rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
svg{display:block;width:100%;height:auto}

/* phone */
body:not(.host){padding-block:0}
.p{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100svh;padding:16px 0 28px}
.p.form{padding-top:0}
.ptop{position:sticky;top:0;z-index:5;margin:0 -16px;padding:max(10px,env(safe-area-inset-top,0px)) 16px 10px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pcount{font:700 .85rem var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.intro{display:flex;flex-direction:column;gap:6px;padding:6px 2px 2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.p>.logo{align-self:flex-start}
.card.q{scroll-margin-top:104px;transition:border-color .25s,background .25s}
.card.q.done{border-color:#F7CDB0;background:#FFFBF8}
.qhead{display:flex;justify-content:space-between;align-items:center}
.okmark{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.card.q.done .okmark{opacity:1;transform:none}
.title{margin:0;font:700 1.45rem/1.15 var(--display);text-transform:uppercase;color:var(--orange);text-wrap:balance}
.qtext{margin:0;font:700 1.2rem/1.28 var(--display);text-wrap:balance}
.note{margin:0;color:var(--muted);font-size:.95rem}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{height:58px;border:2px solid var(--line);border-radius:14px;background:var(--panel);font-weight:700;font-size:1.05rem;transition:background .12s,color .12s,border-color .12s,transform .08s}
.pill:active{transform:scale(.97)}
.pill.yes[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.pill.no[aria-pressed="true"]{background:#4A4A4A;border-color:#4A4A4A;color:#fff}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;gap:14px;min-height:58px;padding:0 16px;background:var(--panel);border:2px solid var(--line);border-radius:14px;font-weight:600;text-align:left;transition:background .12s,border-color .12s}
.chip .box{flex:none;width:24px;height:24px;border:2px solid #C8C2BC;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:.85rem;font-weight:700}
.chip .cl{flex:1}
.chip b{font:700 .95rem var(--display);color:var(--orange-d)}
.chip[aria-pressed="true"]{border-color:var(--orange);background:var(--tint)}
.chip[aria-pressed="true"] .box{background:var(--orange);border-color:var(--orange)}
.chip[aria-pressed="true"] .box::after{content:"\2713"}
.submitbar{position:sticky;bottom:0;margin:auto -16px -28px;padding:12px 16px max(14px,env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
.go{width:100%;height:58px;border:0;border-radius:14px;background:var(--orange);color:#fff;font:700 1.1rem var(--display);transition:background .2s}
.go:disabled{background:#ECE7E2;color:#8A847E;cursor:default}
.hero{align-items:center;text-align:center;gap:10px}
.score{display:flex;align-items:baseline;justify-content:center;gap:8px;font:800 6rem/1 var(--display);color:var(--orange);font-variant-numeric:tabular-nums}
.score small{font:700 1.5rem var(--display);color:var(--muted)}
.meter{width:100%;height:10px;border-radius:5px;background:#EFEAE5;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--orange);border-radius:5px;transition:width .8s ease}
.rank{margin:0;font-weight:600}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mini div{background:#F8F5F2;border-radius:12px;padding:10px 8px}
.mini b{display:block;font:700 1.35rem var(--display);font-variant-numeric:tabular-nums}
.mini span{font-size:.8rem;color:var(--muted)}
.legend{margin:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--orange)}
.sw.ink{background:var(--ink)}
.sw.navy{background:var(--navy)}
.foot{font-size:.85rem;color:var(--muted);text-align:center}

/* chart */
.bar{fill:#CFCFCF}
.bar.you{fill:var(--orange)}
.area{fill:#7F7F7F;fill-opacity:.08}
.line{fill:none;stroke:#7F7F7F;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.axis{stroke:var(--ink);stroke-width:1.5}
.tick{fill:var(--muted);font-family:var(--body);font-weight:600}
.tick.you{fill:var(--orange-d)}
.cnt{fill:var(--ink);font-family:var(--body);font-weight:700}
.youlbl{fill:var(--orange-d);font-family:var(--display);font-weight:800}

/* host */
.b{height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:700}
.b.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.b.ghost:hover{background:#FAF7F4}
.b.ghost.light{color:#fff;border-color:rgba(255,255,255,.4)}
.b.danger{color:#B83A00;border-color:#F3C9B3}
.b.bigbtn{height:60px;padding:0 32px;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.b.bigbtn small{font-size:.7rem;font-weight:600;opacity:.9}
.b:disabled{opacity:.35;cursor:default}
.home{max-width:1120px;margin:0 auto;padding:8px 0 40px;display:flex;flex-direction:column;gap:18px}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hbrand{display:flex;align-items:center;gap:18px}
.ht{margin:0;font:700 1.6rem/1.1 var(--display);text-transform:uppercase;color:var(--orange)}
.ready{display:flex;gap:16px;align-items:flex-start;padding:16px 20px;border-radius:16px;border:1px solid var(--line);background:#FAF7F4}
.ready.ok{background:#EFF8F1;border-color:#BFE0C8}
.ready.warn{background:#FFF6EC;border-color:#F6D2AE}
.ready .ri{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:#B9B2AB}
.ready.ok .ri{background:#2E9E57}
.ready.warn .ri{background:var(--orange)}
.ready h3{margin:0 0 6px;font:700 1rem var(--display)}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks .c{font-weight:700;width:16px;flex:none;text-align:center}
.checks .yes{color:#2E9E57}.checks .no{color:var(--orange-d)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px;align-items:stretch}
.hgrid .wide{grid-column:1/-1}
.card.h{gap:12px}
h2.ct{margin:0;display:flex;align-items:center;gap:10px;font:700 .98rem var(--display);text-transform:uppercase;color:var(--ink)}
.step{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font:700 .85rem var(--body)}
.step.alt{background:#B9B2AB}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{font:700 2.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat.soft{color:var(--muted)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:22px 16px;border:2px dashed #D9D2CB;border-radius:14px;cursor:pointer;color:var(--muted);font-size:.92rem;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--tint);border-color:var(--orange)}
.drop b{color:var(--ink);font-size:1rem}
.dstat{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.dstat .dot2{width:10px;height:10px;border-radius:50%;background:#2E9E57;flex:none}
.dstat.none .dot2{background:#B9B2AB}
.field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-weight:700}
.field input{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;color:var(--ink);background:var(--bg);max-width:100%}
.field input:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange)}
.fields{display:grid;grid-template-columns:110px 1fr;gap:12px}
.prev svg{width:100%;height:auto;display:block}
.linkrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.linkrow .qrs{background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px;line-height:0}
.url{margin:0;font:600 clamp(1rem,2vw,1.6rem) var(--body);word-break:break-all;color:var(--orange-d)}
.meta{margin:0;font-size:1.1rem;font-weight:600;color:var(--muted)}
/* present */
body.present{padding:0;height:100svh;overflow:hidden}
.pres{height:100svh;max-width:1700px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:18px 36px 14px}
.pres .logo{height:72px}
.phead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pfoot{flex:none;display:flex;align-items:flex-end;gap:20px}
.pline{flex:1;height:3px;margin-bottom:10px;background:linear-gradient(90deg,var(--orange),rgba(255,102,0,0))}
.pres.img{padding:0;gap:0;max-width:none}
.pres.img .pfoot{display:none}
.slideimg{display:block;width:100%;height:100%;object-fit:contain}
.ph{display:flex;align-items:center;justify-content:center;height:100%}
.hq{margin:0;font:700 clamp(1.7rem,3.6vw,3.2rem)/1.12 var(--display);text-transform:uppercase;color:var(--orange);text-wrap:balance;max-width:22ch;border-left:8px solid var(--orange);padding-left:18px}
.hq.sm{font-size:clamp(1.6rem,3vw,2.8rem);max-width:none}
.sub{margin:0;font-size:clamp(1.1rem,1.8vw,1.6rem);color:var(--muted);max-width:44ch}
.lobby{display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap}
.lobtxt{display:flex;flex-direction:column;gap:22px;min-width:0}
.lobby .qno,.res .qno{font-size:1rem}
.big{margin:0;font:800 clamp(3rem,7vw,6rem)/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font:600 1.3rem var(--body);color:var(--muted)}
.qr{background:#fff;padding:18px;border-radius:16px;border:1px solid var(--line);line-height:0}
.qr img,.qr canvas{max-width:100%;height:auto}
.res{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.restop{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.chartbox{flex:1;min-height:0;display:flex}
.chartbox svg{width:100%;height:100%}
.pnav{position:fixed;left:20px;bottom:20px;z-index:10;display:flex;gap:10px;align-items:center;padding:8px 12px;background:rgba(58,58,58,.9);color:#fff;border-radius:999px;transition:opacity .3s}
.pnav.idle{opacity:0}
.pnav .b{height:38px;padding:0 16px}
.pager{min-width:70px;text-align:center;font-weight:700}
.obar{fill:#A0A0A0}
.obar.hot{fill:var(--orange)}
.arrow{fill:var(--orange)}
.astem{stroke:var(--orange);stroke-width:3}
.astem.alt{stroke:var(--navy)}
.olbl{fill:var(--orange-d);font-family:var(--display);font-weight:700}
.obar.hot.alt,.arrow.alt{fill:var(--navy)}
.olbl.hot.alt{fill:var(--navy)}
.sw.navy{background:var(--navy)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

}

/* ---------- scoring and chart ---------- */
function scoreOf(p){
  let s = 0;
  if (p && p.a) for (let i = 0; i < NQ; i++) if (p.a["q"+i] === 1) s++;
  if (p && p.i) for (const [k] of INSTRUMENTS) if (p.i[k]) s++;
  return s;
}

function chart(scores, o){
  const w = o.w, h = o.h, fs = o.fs, you = o.you === undefined ? null : o.you, out = o.out || null;
  const big = w > 600;
  const pad = { l:10, r:10, t:fs*2.8, b:fs*2.2 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b, n = MAX + 1, bw = iw / n;
  const c = Array(n).fill(0);
  scores.forEach(s => { if (s >= 0 && s <= MAX) c[s]++; });
  const sig = 1.1, curve = [];
  for (let x = 0; x <= MAX + 1e-9; x += 0.1){
    let v = 0;
    for (let k = 0; k < n; k++) if (c[k]) v += c[k] * Math.exp(-((x-k)*(x-k)) / (2*sig*sig));
    curve.push([x, v / (sig * Math.sqrt(2*Math.PI))]);
  }
  const oc = c;
  const ymax = Math.max(1, ...oc, ...curve.map(p => p[1])) * 1.15 + (out || o.reserve ? 1.2 : 0);
  const X = k => pad.l + bw*(k+0.5);
  const Y = v => pad.t + ih - (v/ymax)*ih;
  const base = pad.t + ih;
  const f = v => v.toFixed(1);
  const pts = curve.map(p => f(X(p[0])) + "," + f(Y(p[1])));
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Distribution of scores">';
  s += '<path class="area" d="M' + f(X(0)) + ',' + f(base) + ' L' + pts.join(' L') + ' L' + f(X(MAX)) + ',' + f(base) + ' Z"/>';
  for (let k = 0; k < n; k++){
    const bh = (c[k]/ymax)*ih;
    s += '<rect class="bar' + (k === you ? ' you' : '') + '" x="' + f(X(k)-bw*.38) + '" y="' + f(base-bh) + '" width="' + f(bw*.76) + '" height="' + f(Math.max(bh,0)) + '" rx="' + f(Math.min(4,bw*.12)) + '"/>';
    if (big && oc[k] > 0) s += '<text class="cnt" x="' + f(X(k)) + '" y="' + f(base-(oc[k]/ymax)*ih-fs*.5) + '" font-size="' + fs + '" text-anchor="middle">' + oc[k] + '</text>';
  }
  s += '<path class="line" d="M' + pts.join(' L') + '"/>';
  s += '<line class="axis" x1="' + pad.l + '" x2="' + (w-pad.r) + '" y1="' + f(base) + '" y2="' + f(base) + '"/>';
  for (let k = 0; k < n; k++){
    if (big || k % 3 === 0) s += '<text class="tick' + (k === you ? ' you' : '') + '" x="' + f(X(k)) + '" y="' + f(base+fs*1.5) + '" font-size="' + fs + '" text-anchor="middle">' + k + '</text>';
  }
  if (you !== null && you >= 0 && you <= MAX){
    const by = base - (c[you]/ymax)*ih;
    s += '<text class="youlbl" x="' + f(X(you)) + '" y="' + f(by - fs*(big ? 1.9 : 0.7)) + '" font-size="' + f(fs*1.1) + '" text-anchor="middle">You</text>';
  }
  if (out){
    const ox = X(out.score), top = base - (oc[out.score]/ymax)*ih, uh = Math.min(ih/ymax, base - top);
    s += '<rect class="obar' + (out.hot ? ' hot' : '') + (out.alt ? ' alt' : '') + '" x="' + f(ox-bw*.38) + '" y="' + f(top) + '" width="' + f(bw*.76) + '" height="' + f(uh) + '" rx="' + f(Math.min(4,bw*.12)) + '"/>';
    if (out.hot){
      const tipY = top - fs*(big ? 1.9 : 1.1), ah = fs*1.5, aw = fs*.9;
      const anchor = ox < w*.22 ? "start" : (ox > w*.78 ? "end" : "middle");
      const lx = anchor === "start" ? ox - bw*.4 : (anchor === "end" ? ox + bw*.4 : ox);
      const ly = fs*1.9;
      s += '<line class="astem' + (out.alt ? ' alt' : '') + '" x1="' + f(ox) + '" x2="' + f(ox) + '" y1="' + f(ly+fs*.6) + '" y2="' + f(tipY-ah) + '"/>';
      s += '<path class="arrow' + (out.alt ? ' alt' : '') + '" d="M' + f(ox-aw) + ',' + f(tipY-ah) + ' L' + f(ox+aw) + ',' + f(tipY-ah) + ' L' + f(ox) + ',' + f(tipY) + ' Z"/>';
      s += '<text class="olbl hot' + (out.alt ? ' alt' : '') + '" x="' + f(lx) + '" y="' + f(ly) + '" font-size="' + f(fs*1.15) + '" text-anchor="' + anchor + '">' + esc(out.label) + '</text>';
    }
  }
  return s + '</svg>';
}

/* ---------- app ---------- */
if (!FIREBASE_CONFIG.databaseURL) {
  setupScreen("Paste your Firebase details into the config block at the top of index.html, then reload.");
} else if (typeof firebase === "undefined") {
  setupScreen("Could not load the Firebase library. Check the internet connection and reload.");
} else {
  start();
}

function start(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  const stateRef = db.ref("quiz/state");
  const playersRef = db.ref("quiz/players");
  let state = { view:"qr" };
  let players = {};
  let loaded = false;
  let raf = 0;

  stateRef.on("value", snap => { state = snap.val() || { view:"qr" }; draw(); });
  playersRef.on("value", snap => { players = snap.val() || {}; loaded = true; draw(); });

  function draw(){
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; isHost ? drawHost() : drawPlayer(); });
  }

  /* ===== participant: one page with every question ===== */
  let view = "", lastKey = "";
  let draft = { a:{}, i:{} };
  try { const d = JSON.parse(ls.get("pmcq_draft") || "null"); if (d && d.a && d.i) draft = d; } catch(e){}

  function myId(){
    let id = ls.get("pmcq_id");
    if (!id){ id = "p_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); ls.set("pmcq_id", id); }
    return id;
  }
  const saveDraft = () => ls.set("pmcq_draft", JSON.stringify(draft));

  function renderForm(){
    $app.innerHTML = '<div class="p form"><header class="ptop"><div class="prow"><img class="logo" src="'+LOGO+'" alt="BPI Gestão de Ativos"><span class="pcount" id="pcount"></span></div>' +
      '<div class="prog"><i id="pbar" style="width:0%"></i></div></header>' +
      '<div class="intro"><h1 class="title">How’s your portfolio of experiences?</h1>' +
      '<p class="note">About 2 minutes. Anonymous. Let’s see if you beat the benchmark.</p></div>' +
      QUESTIONS.map((t, q) =>
        '<section class="card q" id="qc' + q + '"><div class="qhead"><p class="qno">' + (q+1) + '</p><span class="okmark" aria-hidden="true">✓</span></div><h2 class="qtext">' + esc(t) + '</h2>' +
        '<div class="yn"><button class="pill yes" data-q="' + q + '" data-v="1" aria-pressed="false">Yes</button>' +
        '<button class="pill no" data-q="' + q + '" data-v="0" aria-pressed="false">No</button></div></section>').join("") +
      '<section class="card q" id="qci"><div class="qhead"><p class="qno">' + (NQ+1) + '</p></div><h2 class="qtext">Which of these have you invested in?</h2>' +
      '<p class="note">Tick all that apply. Each one is worth 1 point. Skip if none.</p><div class="chips">' +
      INSTRUMENTS.map(([k, l]) => '<button class="chip" data-i="' + k + '" aria-pressed="false"><span class="box"></span><span class="cl">' + esc(l) + '</span><b></b></button>').join("") +
      '</div></section>' +
      '<div class="submitbar"><button class="go" id="submitBtn" disabled>See my score</button></div></div>';
    paintForm();
  }

  function answered(q){ return draft.a["q"+q] === 0 || draft.a["q"+q] === 1; }
  function firstOpen(){ for (let q = 0; q < NQ; q++) if (!answered(q)) return q; return -1; }

  function paintForm(){
    document.querySelectorAll("[data-q]").forEach(b => {
      b.setAttribute("aria-pressed", String(draft.a["q" + b.dataset.q] === parseInt(b.dataset.v, 10)));
    });
    document.querySelectorAll("[data-i]").forEach(b => {
      const on = !!draft.i[b.dataset.i];
      b.setAttribute("aria-pressed", String(on));
      b.lastElementChild.textContent = on ? "+1" : "";
    });
    let done = 0;
    for (let q = 0; q < NQ; q++){
      const ok = answered(q);
      if (ok) done++;
      const c = document.getElementById("qc" + q);
      if (c) c.classList.toggle("done", ok);
    }
    const btn = document.getElementById("submitBtn");
    const cnt = document.getElementById("pcount"), bar = document.getElementById("pbar");
    if (btn){
      btn.disabled = done < NQ;
      btn.textContent = done < NQ ? "Answer " + (NQ - done) + " more to continue" : "See my score";
    }
    if (cnt) cnt.textContent = done + " of " + NQ + " answered";
    if (bar) bar.style.width = Math.round(done / NQ * 100) + "%";
  }

  function scrollToCard(id){
    const el = document.getElementById(id);
    if (!el) return;
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  }

  function submit(){
    if (Object.keys(draft.a).length < NQ) return;
    const a = {}, i = {};
    for (let q = 0; q < NQ; q++) a["q"+q] = draft.a["q"+q] === 1 ? 1 : 0;
    INSTRUMENTS.forEach(([k]) => { if (draft.i[k]) i[k] = true; });
    const btn = document.getElementById("submitBtn");
    if (btn){ btn.disabled = true; btn.textContent = "Sending"; }
    playersRef.child(myId()).set({ a: a, i: i, t: firebase.database.ServerValue.TIMESTAMP });
    draft = { a:{}, i:{} }; saveDraft();
  }

  function renderResults(me, all, first){
    const id = myId();
    const s = scoreOf(me);
    const others = Object.entries(players).filter(([k]) => k !== id).map(([, p]) => scoreOf(p));
    const lower = others.filter(x => x < s).length;
    const rank = others.length ? 'You outperformed ' + Math.round(lower/others.length*100) + '% of the room.' : 'You are the first one in. Others are still answering.';
    const o = state.outlier;
    const avg = all.length ? all.reduce((a, b) => a + b, 0) / all.length : 0;
    $app.innerHTML = '<div class="p"><img class="logo" src="'+LOGO+'" alt="BPI Gestão de Ativos">' +
      '<div class="card hero"><p class="qno">Your return</p><div class="score"><span id="scoreNum">' + s + '</span><small>/ ' + MAX + '</small></div>' +
      '<div class="meter"><i style="width:' + Math.round(s/MAX*100) + '%"></i></div><p class="rank">' + rank + '</p>' +
      '<div class="mini"><div><b>' + avg.toFixed(1) + '</b><span>Benchmark</span></div><div><b>' + all.length + '</b><span>Answers so far</span></div></div></div>' +
      '<div class="card"><p class="qno">The room, live</p>' + chart(o ? all.concat([o.score]) : all, { w:360, h:250, fs:11, you:s, out: o ? { score:o.score, label:o.label, hot:true, alt:true } : null }) +
      '<p class="legend"><span><i class="sw"></i>You</span>' + (o ? '<span><i class="sw navy"></i>Our guest, ' + o.score + ' points</span>' : '') + '</p></div>' +
      '<p class="foot">Keep this page open and watch the main screen.</p></div>';
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (first && !calm){
      const el = document.getElementById("scoreNum"), t0 = performance.now();
      const tick = t => { const k = Math.min(1, (t - t0) / 700); el.textContent = Math.round(s * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };
      el.textContent = "0"; requestAnimationFrame(tick);
    }
  }

  function drawPlayer(){
    if (!loaded) return;
    const me = players[myId()];
    if (!me){
      if (view !== "form"){ view = "form"; lastKey = ""; renderForm(); }
      return;
    }
    const all = Object.values(players).map(scoreOf);
    const key = JSON.stringify([all.slice().sort().join(","), state.outlier || 0, scoreOf(me)]);
    if (view === "results" && key === lastKey) return;
    const first = view !== "results";
    view = "results"; lastKey = key;
    renderResults(me, all, first);
  }

  $app.addEventListener("click", e => {
    if (isHost) return;
    const yn = e.target.closest("[data-q]");
    if (yn){
      const q = parseInt(yn.dataset.q, 10);
      const wasNext = firstOpen() === q;
      draft.a["q" + q] = parseInt(yn.dataset.v, 10); saveDraft(); paintForm();
      if (wasNext){
        const nx = firstOpen();
        setTimeout(() => scrollToCard(nx === -1 ? "qci" : "qc" + nx), 260);
      }
      return;
    }
    const ch = e.target.closest("[data-i]");
    if (ch){ draft.i[ch.dataset.i] = !draft.i[ch.dataset.i]; saveDraft(); paintForm(); return; }
    if (e.target.closest("#submitBtn")) submit();
  });

  /* ===== host: control room + presentation ===== */
  const $ = sel => document.querySelector(sel);
  const configRef = db.ref("quiz/config");
  const deckRef = db.ref("quiz/deck");
  const deckMetaRef = db.ref("quiz/deck/meta");
  const deckSlidesRef = db.ref("quiz/deck/slides");
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const clampScore = v => Math.max(0, Math.min(MAX, parseInt(v, 10) || 0));
  let config = { score: 1, label: DEFAULT_LABEL };
  let deck = null;
  let deckCache = [];
  let mode = "home", builtMode = "", stageKey = "", step = 0, idleTimer = 0;

  if (isHost){
    configRef.on("value", s => { const v = s.val(); if (v) config = { score: clampScore(v.score), label: v.label || DEFAULT_LABEL }; draw(); });
    deckMetaRef.on("value", s => { deck = s.val(); deckCache = []; draw(); });
  }

  const getSteps = () => {
    const a = [{ t:"qr" }, { t:"curve", hot:false }, { t:"curve", hot:true }];
    const n = deck ? deck.count : 0;
    for (let i = 0; i < n; i++) a.push({ t:"img", i:i });
    return a;
  };

  function loadSlide(i){
    if (deckCache[i] !== undefined) return;
    deckCache[i] = null;
    deckSlidesRef.child(String(i)).once("value").then(s => { deckCache[i] = s.val(); draw(); });
  }

  function twoClick(btn, idle, fn){
    if (btn.dataset.armed){ clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; btn.textContent = idle; fn(); return; }
    btn.textContent = "Click again to confirm";
    btn.dataset.armed = String(setTimeout(() => { delete btn.dataset.armed; btn.textContent = idle; }, 4000));
  }

  function addSim(){
    const prior = [.3,.85,.6,.55,.9,.95,.35,.3,.9,.8,.5,.8];
    const pr = { stocks:.85, funds:.65, ppr:.45, crypto:.4, bonds:.3 };
    const upd = {};
    for (let n = 1; n <= 50; n++){
      const base = 0.75 + Math.random()*0.5;
      const a = {}; let invested = false;
      for (let q = 0; q < NQ; q++){
        const yes = Math.random() < Math.min(.95, prior[q]*base) ? 1 : 0;
        a["q"+q] = yes;
        if (q === NQ-1) invested = yes === 1;
      }
      const inst = {};
      if (invested) INSTRUMENTS.forEach(([k]) => { if (Math.random() < pr[k]*base) inst[k] = true; });
      upd["sim_" + String(n).padStart(3, "0")] = { sim:true, a:a, i:inst };
    }
    playersRef.update(upd);
  }

  function removeSim(){
    const upd = {};
    Object.keys(players).filter(k => k.indexOf("sim_") === 0).forEach(k => { upd[k] = null; });
    if (Object.keys(upd).length) playersRef.update(upd);
  }

  function restartQuiz(){ playersRef.remove(); stateRef.remove(); }

  function loadScript(src){
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src));
      document.head.appendChild(s);
    });
  }

  async function uploadDeck(file){
    const msg = t => { const el = $("#deckMsg"); if (el) el.textContent = t; };
    const bar = p => { const el = $("#deckBar"); if (el) el.style.width = p + "%"; };
    const name = file.name;
    if (/\.pptx?$/i.test(name)){ msg("PowerPoint files can't be read in the browser. In PowerPoint choose File, Export, PDF, then upload that PDF."); return; }
    if (!/\.pdf$/i.test(name) && file.type !== "application/pdf"){ msg("Please choose a PDF file."); return; }
    try {
      msg("Loading the PDF reader");
      if (typeof pdfjsLib === "undefined") await loadScript(PDFJS);
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const n = pdf.numPages;
      await deckRef.remove();
      bar(0);
      for (let i = 1; i <= n; i++){
        msg("Processing slide " + i + " of " + n);
        const page = await pdf.getPage(i);
        const v0 = page.getViewport({ scale:1 });
        const vp = page.getViewport({ scale: 1600 / v0.width });
        const cv = document.createElement("canvas");
        cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        let q = .82, url = cv.toDataURL("image/jpeg", q);
        while (url.length > 900000 && q > .45){ q -= .12; url = cv.toDataURL("image/jpeg", q); }
        await deckSlidesRef.child(String(i-1)).set(url);
        bar(Math.round(i / n * 100));
      }
      await deckMetaRef.set({ name: name, count: n });
      msg("Done. " + n + " slides uploaded.");
    } catch(e){
      msg("Upload failed: " + (e && e.message ? e.message : e));
    }
  }

  /* ----- home ----- */
  function buildHome(){
    document.body.classList.remove("present");
    document.body.classList.add("host");
    $app.innerHTML =
      '<div class="home"><header class="hhead"><div class="hbrand"><img class="logo" src="'+LOGO+'" alt="BPI Gestão de Ativos"><div><h1 class="ht">Control room</h1><p class="note">PMC Live Quiz</p></div></div>' +
      '<button class="b bigbtn" id="bPresent"><span>Present</span><small id="presSub"></small></button></header>' +
      '<section class="ready" id="ready"></section>' +
      '<div class="hgrid">' +
      '<section class="card h"><h2 class="ct"><span class="step">1</span>Presentation</h2>' +
        '<div class="dstat none" id="deckStatus"><i class="dot2"></i><span></span></div>' +
        '<label class="drop" id="drop"><b>Drop a PDF here</b><span>or click to choose a file</span><input type="file" id="deckFile" accept=".pdf,.ppt,.pptx,application/pdf" hidden></label>' +
        '<div class="prog"><i id="deckBar" style="width:0%"></i></div><p class="note" id="deckMsg">From PowerPoint: File, Export, PDF. Animations and videos will not play.</p>' +
        '<div class="row"><button class="b ghost danger" id="bRmDeck">Remove presentation</button></div></section>' +
      '<section class="card h"><h2 class="ct"><span class="step">2</span>Guest</h2>' +
        '<div class="fields"><label class="field">Score<input type="number" id="outScore" min="0" max="' + MAX + '"></label>' +
        '<label class="field">Arrow label<input type="text" id="outLabel"></label></div>' +
        '<p class="note">Your father is counted in the graph from the start. On the last results screen an arrow and an orange segment point to his score.</p></section>' +
      '<section class="card h"><h2 class="ct"><span class="step">3</span>Test with mock answers</h2>' +
        '<div class="stats"><div><div class="stat" id="hReal">0</div><div class="note">real</div></div>' +
        '<div><div class="stat soft" id="hMock">0</div><div class="note">mock</div></div>' +
        '<div><div class="stat" id="hAvg">0</div><div class="note">average score</div></div></div>' +
        '<div class="row"><button class="b ghost" id="bSim">Add 50 mock answers</button><button class="b ghost" id="bUnsim">Remove mock answers</button></div></section>' +
      '<section class="card h"><h2 class="ct"><span class="step alt">4</span>On the day</h2>' +
        '<p class="note">Before the event, restart the quiz. This deletes every answer, real and mock, so the room starts at zero. The presentation and the guest score stay.</p>' +
        '<div class="row"><button class="b ghost danger" id="bReset">Restart quiz</button></div></section>' +
      '<section class="card h wide"><h2 class="ct">Participant link</h2><div class="linkrow"><div class="qrs" id="homeQr"></div>' +
        '<div style="min-width:0;flex:1"><p class="url">' + esc(joinUrl) + '</p><div class="row" style="margin-top:10px"><button class="b ghost" id="bCopy">Copy link</button></div>' +
        '<p class="note" style="margin-top:8px">Scan with your phone to try the quiz yourself.</p></div></div></section>' +
      '</div></div>';
    $("#outScore").value = config.score;
    $("#outLabel").value = config.label;
    const q = document.getElementById("homeQr");
    if (typeof QRCode !== "undefined") new QRCode(q, { text: joinUrl, width: 120, height: 120, colorDark: "#3A3A3A", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M });
    else q.style.display = "none";
  }

  function updateHome(){
    const list = Object.entries(players);
    const real = list.filter(([k]) => k.indexOf("sim_") !== 0).length, mock = list.length - real;
    const scores = list.map(([, p]) => scoreOf(p));
    const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;

    if (document.activeElement !== $("#outScore")) $("#outScore").value = config.score;

    const clean = list.length === 0, noMock = mock === 0, ready = !!deck && noMock && clean;
    const item = (ok, good, todo) => '<li><span class="c ' + (ok ? "yes" : "no") + '">' + (ok ? "\u2713" : "\u2022") + '</span>' + (ok ? good : todo) + '</li>';

    rd.innerHTML = '<div class="ri">' + (ready ? "\u2713" : "!") + '</div><div><h3>' + (ready ? "Ready for the day" : "Before the event") + '</h3><ul class="checks">' +
      item(!!deck, "Presentation uploaded", "Upload the presentation (you can still present without it)") +
      item(noMock, "No mock answers", "Delete the mock answers (" + mock + ")") +
      item(clean, "Quiz is clean, 0 answers", "Restart the quiz (" + list.length + " answers in the database)") +
      '</ul></div>';
  }

  function startPresent(){
    mode = "present"; step = 0; builtMode = ""; stageKey = "";
    const de = document.documentElement;
    if (de.requestFullscreen && !document.fullscreenElement) de.requestFullscreen().catch(() => {});
    draw();
  }

  function exitPresent(){
    mode = "home"; builtMode = "";
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    draw();
  }

  function go(d){
    const n = Math.max(0, Math.min(getSteps().length - 1, step + d));
    if (n !== step){ step = n; draw(); }
  }

  /* ----- presentation ----- */
  function buildPresent(){
    document.body.classList.add("host", "present");
    $app.innerHTML =
      '<div class="pres" id="pres"><main class="pbody" id="pbody"></main>' +
      '<footer class="pfoot"><i class="pline"></i><img class="logo" src="'+LOGO+'" alt="BPI Gestão de Ativos"></footer></div>' +
      '<div class="pnav" id="pnav"><button class="b ghost light" id="pPrev">←</button><span class="pager" id="pPos"></span><button class="b" id="pNext">→</button><button class="b ghost light" id="pExit">Exit</button></div>';
    bumpNav();
  }

  function bumpNav(){
    const nav = $("#pnav"); if (!nav) return;
    nav.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => nav.classList.add("idle"), 2500);
  }

  function buildStage(st){
    const b = $("#pbody");
    if (st.t === "curve"){
      b.innerHTML = '<div class="res"><div class="restop"><div><p class="qno">Live scores</p><h1 class="hq sm">Where the room landed</h1></div>' +
        '<p class="meta" id="sMeta"></p></div><div class="chartbox" id="sChart"></div></div>';
    } else if (st.t === "img"){
      const src = deckCache[st.i];
      b.innerHTML = src ? '<img class="slideimg" alt="" src="' + src + '">' : '<div class="ph"><p class="qno">Loading slide ' + (st.i + 1) + '</p></div>';
    } else {
      b.innerHTML = '<div class="lobby"><div class="lobtxt"><p class="qno">Scan with your phone</p>' +
        '<h1 class="hq">Beat the benchmark. 13 questions, 2 minutes.</h1><p class="sub">Anonymous. You get your own score, and we all see the room.</p>' +
        '<p class="big"><span id="sCount">0</span> <small>have answered</small></p></div><div class="qr" id="qr"></div></div>';
      const box = document.getElementById("qr");
      if (typeof QRCode !== "undefined") new QRCode(box, { text: joinUrl, width: 340, height: 340, colorDark: "#3A3A3A", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M });
      else box.textContent = joinUrl;
    }
  }

  function updatePresent(){
    const steps = getSteps();
    step = Math.max(0, Math.min(steps.length - 1, step));
    const st = steps[step];
    if (deck) for (let i = 0; i < deck.count; i++) loadSlide(i);
    const list = Object.values(players), n = list.length;
    const key = st.t === "img" ? "img" + st.i + (deckCache[st.i] ? "y" : "n") : st.t + (st.hot ? "h" : "");
    if (key !== stageKey){
      stageKey = key;
      $("#pres").classList.toggle("img", st.t === "img");
      buildStage(st);
    }
    if (st.t === "qr"){
      $("#sCount").textContent = n;
    } else if (st.t === "curve"){
      const scores = list.map(scoreOf);
      const avg = n ? scores.reduce((a, b) => a + b, 0) / n : 0;
      $("#sMeta").textContent = n + " answered · average " + avg.toFixed(1) + " of " + MAX;
      $("#sChart").innerHTML = chart(scores.concat([config.score]), { w:1000, h:520, fs:20, reserve:true, out: st.hot ? { score: config.score, label: config.label, hot: true } : null });
    }
    $("#pPos").textContent = (step + 1) + " / " + steps.length;
    $("#pPrev").disabled = step === 0;
    $("#pNext").disabled = step === steps.length - 1;
  }

  /* phones see the outlier once it has been revealed in orange */
  function syncOutlier(){
    const want = (mode === "present" && step >= 2) ? { score: config.score, label: config.label, hot: true } : null;
    const have = state.outlier || null;
    const same = (!want && !have) || (want && have && have.score === want.score && have.label === want.label);
    if (same) return;
    if (want) stateRef.child("outlier").set(want); else stateRef.child("outlier").remove();
  }

  function drawHost(){
    if (mode !== builtMode){ builtMode = mode; if (mode === "home") buildHome(); else buildPresent(); }
    if (mode === "home") updateHome(); else updatePresent();
    syncOutlier();
  }

  if (isHost){
    $app.addEventListener("click", e => {
      const id = e.target.closest("button, label, input, [id]") ? (e.target.closest("[id]") || {}).id : "";
      if (id === "bPresent") startPresent();
      else if (id === "bSim") addSim();
      else if (id === "bUnsim") removeSim();
      else if (id === "bReset") twoClick(e.target.closest("button"), "Restart quiz", restartQuiz);
      else if (id === "bRmDeck") twoClick(e.target.closest("button"), "Remove presentation", () => { deckRef.remove(); const m = $("#deckMsg"); if (m) m.textContent = ""; const b = $("#deckBar"); if (b) b.style.width = "0%"; });
      else if (id === "bCopy"){ const b = e.target.closest("button"); try { navigator.clipboard.writeText(joinUrl).then(() => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy link"; }, 1500); }, () => {}); } catch(err){} }
      else if (id === "pPrev") go(-1);
      else if (id === "pNext") go(1);
      else if (id === "pExit") exitPresent();
    });
    $app.addEventListener("change", e => {
      if (e.target.id === "deckFile" && e.target.files[0]){ const f = e.target.files[0]; e.target.value = ""; uploadDeck(f); }
      else if (e.target.id === "outScore" || e.target.id === "outLabel"){
        configRef.set({ score: clampScore($("#outScore").value), label: ($("#outLabel").value || "").trim() || DEFAULT_LABEL });
      }
    });
    $app.addEventListener("dragover", e => { const d = e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } });
    $app.addEventListener("dragleave", e => { const d = e.target.closest("#drop"); if (d) d.classList.remove("over"); });
    $app.addEventListener("drop", e => {
      const d = e.target.closest("#drop"); if (!d) return;
      e.preventDefault(); d.classList.remove("over");
      const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) uploadDeck(f);
    });
    document.addEventListener("mousemove", () => { if (mode === "present") bumpNav(); });
    document.addEventListener("keydown", e => {
      if (mode !== "present") return;
      const k = e.key;
      if (k === " " || k === "ArrowRight" || k === "PageDown" || k === "Enter"){ e.preventDefault(); go(1); bumpNav(); }
      else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace"){ e.preventDefault(); go(-1); bumpNav(); }
      else if (k === "Escape") exitPresent();
      else if (k === "f" || k === "F"){
        const d = document;
        if (!d.fullscreenElement && d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
        else if (d.exitFullscreen) d.exitFullscreen();
      }
    });
  }
}
</script>
</body>
</html>
